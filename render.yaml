services:
  - type: web
    name: forager-hubspot-enrichment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FORAGER_API_KEY
        sync: false
      - key: FORAGER_ACCOUNT_ID
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /tmp/app.db
      - key: LOG_LEVEL
        value: INFO
