[project]
name = "forager-hubspot-enrichment"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: calls real external APIs and may spend Forager credits (opt-in: RUN_LIVE_TESTS=1 pytest -m live)",
]
